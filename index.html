<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garmin Notis-Synk</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #007bff; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 150px; resize: vertical; }
        button { width: 100%; padding: 12px; margin-top: 20px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn-connect { background-color: #28a745; color: white; }
        .btn-send { background-color: #007bff; color: white; }
        .status { margin-top: 15px; padding: 10px; border-radius: 4px; text-align: center; font-weight: bold; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <h2>Garmin Notis-Synk 📲➔⌚</h2>
    
    <button class="btn-connect" id="connectBtn">Anslut till Instinct 3</button>
    <div id="statusDiv" class="status"></div>

    <label for="noteNum">Notis Nummer (0 - 19):</label>
    <select id="noteNum">
        <!-- Genererar 20 val dynamiskt -->
        <script>
            for(let i=0; i<20; i++) {
                document.write(`<option value="${i}">Notis ${i+1}</option>`);
            }
        </script>
    </select>

    <label for="noteTitle">Rubrik:</label>
    <input type="text" id="noteTitle" placeholder="Ex: Att Handla" maxlength="30">

    <label for="noteText">Text (Ingen bokstavsgräns, radbrytningar fungerar!):</label>
    <textarea id="noteText" placeholder="Skriv din långa notering här...&#10;Tryck Enter för ny rad."></textarea>

    <button class="btn-send" id="sendBtn" disabled>Skicka trådlöst till klockan</button>
</div>

<script>
    // Garmins officiella standard-UUIDs för Connect IQ-kommunikation
    const GARMIN_SERVICE_UUID = "6a4e2500-66b6-11e3-949a-0800200c9a66"; 
    const GARMIN_WRITE_CHAR_UUID = "6a4e2501-66b6-11e3-949a-0800200c9a66";

    let gattServer = null;
    let writeCharacteristic = null;

    const connectBtn = document.getElementById('connectBtn');
    const sendBtn = document.getElementById('sendBtn');
    const statusDiv = document.getElementById('statusDiv');

    function showStatus(text, type) {
        statusDiv.innerText = text;
        statusDiv.className = `status ${type}`;
        statusDiv.style.display = 'block';
    }

    // Anslut till klockan via Web Bluetooth
    connectBtn.addEventListener('click', async () => {
        try {
            showStatus("Söker efter klocka...", "info");
            
            // Leta efter en enhet som stöder Garmins standard-kommunikationstjänst
                const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [GARMIN_SERVICE_UUID]
            });

            showStatus("Ansluter till enhet...", "info");
            gattServer = await device.gatt.connect();
            
            const service = await gattServer.getPrimaryService(GARMIN_SERVICE_UUID);
            writeCharacteristic = await service.getCharacteristic(GARMIN_WRITE_CHAR_UUID);

            showStatus("Ansluten till klockan klockrent! 🎉", "success");
            connectBtn.style.backgroundColor = "#6c757d";
            connectBtn.innerText = "Ansluten";
            sendBtn.disabled = false;
        } catch (err) {
            console.error(err);
            showStatus("Kunde inte ansluta: " + err.message, "error");
        }
    });

    // Skicka datan i paket (chunks)
    sendBtn.addEventListener('click', async () => {
        if (!writeCharacteristic) return;

        const num = document.getElementById('noteNum').value;
        const title = document.getElementById('noteTitle').value.trim();
        const text = document.getElementById('noteText').value;

        if (!title || !text) {
            showStatus("Fyll i både rubrik och text först!", "error");
            return;
        }

        // Bygg ihop strängen i det format klockan förväntar sig: "NUMMER|RUBRIK|TEXT"
        const fullMessage = `${num}|${title}|${text}`;
        
        try {
            showStatus("Skickar notis...", "info");
            
            const encoder = new TextEncoder();
            const dataBytes = encoder.encode(fullMessage);
            const endBytes = encoder.encode("[END]");

            // BLE tillåter oftast max 20-512 bytes per paket. Vi skickar säkert i bitar om 20 bytes.
            const chunkSize = 20;
            for (let offset = 0; offset < dataBytes.length; offset += chunkSize) {
                const chunk = dataBytes.slice(offset, offset + chunkSize);
                await writeCharacteristic.writeValue(chunk);
                // Liten mikropaus för att klockans buffert ska hinna med
                await new Promise(r => setTimeout(r, 20)); 
            }

            // Skicka slut-signalen så klockan sparar texten
            await writeCharacteristic.writeValue(endBytes);

            showStatus(`Notis sparad som nummer ${parseInt(num)+1} på klockan! 🚀`, "success");
            
            // Töm fälten för nästa notis
            document.getElementById('noteTitle').value = "";
            document.getElementById('noteText').value = "";
        } catch (err) {
            console.error(err);
            showStatus("Fel vid sändning: " + err.message, "error");
        }
    });
</script>

</body>
</html>
